name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependency lock for security updates
        run: npm install --ignore-scripts
      - name: Commit refreshed lockfile on feature branch push
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock"
          git push
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Reject critical development dependency advisories
        run: npm audit --audit-level=critical
      - name: Type-check
        run: npm run type-check
      - name: Tests
        run: npm test
      - name: Wrangler dry-run build
        run: npm run build-check
